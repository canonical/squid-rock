summary: test cache is persisted and served through different instances

execute: |
  # Cleanup function
  cleanup() {
    docker stop squid test-web-server >/dev/null 2>&1 || true
    docker volume rm squid-cache >/dev/null 2>&1 || true
    docker network rm squid-test >/dev/null 2>&1 || true
  }
  trap cleanup EXIT

  # Create a volume for the test
  docker volume create squid-cache

  # Create a network for the test
  docker network create squid-test

  # Spin up a test web server (i.e apache2 image)
  docker run --rm -d --name test-web-server --network squid-test ubuntu/apache2:2.4-26.04_edge

  # Start the squid container
  docker run --rm -d --name squid \
  -p 3128:3128 \
  --network squid-test \
  -v squid-cache:/var/spool/squid \
  -v $(pwd)/squid.conf:/etc/squid/squid.conf:ro \
  squid:7.2-26.04

  # Wait for the setup to be ready
  timeout 30 bash -c 'until curl -s -x http://127.0.0.1:3128 http://test-web-server >/dev/null; do sleep 1; done'

  # Test that squid connected to the test web server
  docker exec squid cat /var/log/squid/access.log | grep -qF "TCP_MISS/200"

  # stop and relaunch the squid container
  docker stop squid
  docker wait squid >/dev/null 2>&1 || true
  timeout 30 bash -c 'while docker container inspect squid >/dev/null 2>&1; do sleep 1; done'
  docker run --rm -d --name squid \
  -p 3128:3128 \
  --network squid-test \
  -v squid-cache:/var/spool/squid \
  -v $(pwd)/squid.conf:/etc/squid/squid.conf:ro \
  squid:7.2-26.04

  # Wait for the setup to be ready
  timeout 30 bash -c 'until curl -s -x http://127.0.0.1:3128 http://test-web-server >/dev/null; do sleep 1; done'

  # Test that squid cached the response from the previous instance and served it
  docker exec squid cat /var/log/squid/access.log | grep -qF "TCP_REFRESH_UNMODIFIED/200"
