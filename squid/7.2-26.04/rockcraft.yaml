name: squid
version: "7.2"

summary: Full featured Web Proxy cache (HTTP proxy GnuTLS flavour)
description: |
    Squid is a full-featured web proxy cache server application which
    provides proxy and cache services for Hyper Text Transport Protocol (HTTP),
    File Transfer Protocol (FTP), and other popular network protocols.

base: bare
build-base: ubuntu@26.04
run-user: _daemon_

platforms:
  amd64:
  arm64:
  ppc64el:
  s390x:

services:
  squid:
    override: replace
    command: /usr/local/bin/entrypoint.sh [ -f /etc/squid/squid.conf -NYC ]
    startup: enabled

parts: 
  squid:
    plugin: nil
    # TODO: Uncomment and remove git+override-build once slices are merged.
    # See https://github.com/canonical/chisel-releases/pull/993
    #
    # stage-packages:
    #   - base-files_base
    #   - base-files_chisel
    #   - base-files_release-info
    #   - base-passwd_data
    #   - squid_core
    #   - squid_auth
    #   - squid_acl
    #   - squid_caching
    #   - squid_cert
    #   - squid-common_data
    #   - tzdata_zoneinfo
    #   - libc-bin_nsswitch
    #   - libpam-modules_libs # For pam authentication capabilities
    source: https://github.com/alesancor1/chisel-releases.git
    source-type: git
    source-branch: 26.04/squid
    override-build: |
        chisel cut --release ./ --ignore unstable --root ${CRAFT_PART_INSTALL} \
          base-files_base \
          base-files_chisel \
          base-files_release-info \
          base-passwd_data \
          squid_core \
          squid_auth \
          squid_acl \
          squid_caching \
          squid_cert \
          squid-common_data \
          tzdata_zoneinfo \
          libc-bin_nsswitch \
          libpam-modules_libs
    override-prime: |
        craftctl default

        # Change default configuration to allow local network access
        sed -i 's/^#http_access allow localnet$/http_access allow localnet/' ${CRAFT_PRIME}/etc/squid/conf.d/debian.conf;
        echo "# Set max_filedescriptors to avoid using system's RLIMIT_NOFILE. See LP: #1978272" > ${CRAFT_PRIME}/etc/squid/conf.d/rock.conf;
        echo 'max_filedescriptors 1024' >> ${CRAFT_PRIME}/etc/squid/conf.d/rock.conf;

        # Change default configuration to run the image as _daemon_ user instead of proxy
        sed -i 's/^#cache_effective_user proxy$/cache_effective_user _daemon_/' ${CRAFT_PRIME}/etc/squid/conf.d/debian.conf;

        # Set permissions for _daemon_ user
        chown -R 584792:584792 ${CRAFT_PRIME}/var/spool/squid
        chown -R 584792:584792 ${CRAFT_PRIME}/var/log/squid
        chown -R 584792:584792 ${CRAFT_PRIME}/run

        # Configure pinger (maintainer scripts)
        chmod u+s ${CRAFT_PRIME}/usr/lib/squid/pinger
  
  entrypoint:
    plugin: dump
    source: .
    source-type: local
    stage-packages:
      - dash_bins
      - coreutils_tail
    organize:
      'entrypoint.sh': usr/local/bin/entrypoint.sh
    stage:
        - usr
    override-prime: |
      craftctl default

      # Set execute permissions for the entrypoint script
      chmod +x ${CRAFT_PRIME}/usr/local/bin/entrypoint.sh

  deb-security-manifest:
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
